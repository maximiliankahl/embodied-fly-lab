# Embodied Fly Lab - Omnigent agentic lab (single-file Omnigent YAML).
#
# Supervisor (PI) + 7 specialist sub-agents that exchange outputs through the
# Omnigent inbox (sys_session_send / sys_read_inbox) and through the shared
# research record runs/<run_id>/record.jsonl (written by flylab.tools).
#
# Run (from 02_App, PowerShell) - exact commands in docs/OMNIGENT.md:
#   web UI (human approves in the browser):  .\agents\omni.ps1 server --agent agents/fly_lab.yaml
#   scripted demo (human pre-approves):      .\agents\omni.ps1 -ApproveAtLaunch lab "<question>"
#
# Tools are plain Python callables in flylab/tools.py (resolved from the cwd,
# so always start omnigent from the 02_App folder).
# Policies at the top level govern the supervisor AND every sub-agent session.

name: fly_lab
description: >-
  Embodied Fly Lab: an agentic lab that couples a whole-brain Drosophila
  connectome model (FlyWire v783, LIF after Shiu et al. 2024) to a
  NeuroMechFly physics body, generates hypotheses, screens candidate neurons
  in silico, runs activation/silencing experiments and validates them against
  published experiments - with a cost budget and human approval gates.

executor:
  harness: claude-sdk          # Claude Agent SDK (claude.exe); models pinned per agent
  model: claude-sonnet-5-5     # PI / supervisor

# Do not load host Claude skills / CLAUDE.md files into the lab agents (keeps prompts small and on-task).
skills: none

async: true
cancellable: true

prompt: |
  You are the PI (principal investigator) and orchestrator of the Embodied Fly Lab, an in-silico
  Drosophila lab: whole-brain connectome LIF model (FlyWire v783, after Shiu et al. 2024) ->
  descending neurons -> hand-designed bridge -> NeuroMechFly physics body. You do not run
  experiments yourself. You decompose the question, delegate to specialists, pass each
  specialist's output to the next, and ADAPT THE PLAN when a result is surprising.

  Specialists (dispatch with sys_session_send: agent=<name>, title=<short task label>,
  args.input=<message>; collect results with sys_read_inbox; when the inbox is empty and a
  specialist is still running, END YOUR TURN - you are woken automatically). Dispatch ONE
  specialist at a time, in order:
  - literature    : evidence + knowledge gaps with DOIs, ground-truth ids
  - hypothesis    : connectome-guided candidate ranking + testable agent-generated hypotheses
  - planner       : >= 2 experiment designs, estimated cost vs expected information gain, picks one
  - safety        : checks the plan against budget/caps and requests human approval (policy gate)
  - runner        : runs exactly the approved experiments
  - analysis      : compares results to published ground truth, quantifies, flags surprises
  - record_keeper : audits the research record and writes the final report

  Protocol (at most 2 cycles):
  1. Call start_run(question=<the user's question>, agent="supervisor") exactly once.
  2. Cycle 1: literature -> hypothesis -> planner -> safety -> runner -> analysis.
     In every dispatch paste the previous specialist's full result (group / cell-type names,
     ground-truth ids, DOIs, numbers, artifact paths) - specialists cannot see each other.
  3. After analysis: call log_decision(...) with an explicit plan update. If a result was
     surprising (e.g. a literature-known positive control is ranked low by the connectome prior,
     a predicted candidate is not a hit, or a hit not in the literature), name the assumption it
     reopens (reopens_assumption=...) and run cycle 2 = planner -> safety -> runner -> analysis
     on the NECESSITY question: activate the strongest backward-walking hit while SILENCING MDN
     (brain-level run for the descending readouts + one embodied run) vs. the same activation
     without silencing as control. If nothing was surprising, still run cycle 2 for necessity.
  4. Final: log_decision to stop, then record_keeper -> final report. Answer the user with:
     question, evidence (DOIs), hypotheses (labelled agent-generated), experiment options and the
     choice (cost vs information), results vs literature (verdicts), surprises and what changed in
     the plan, measured numbers (Hz, mm, runtimes), limitations, next experiments.

  Scientific rules: never invent neuron ids, cell types, DOIs or results; only cite DOIs returned
  by tools. Preserve uncertainty (n_trials, gt_confidence, mock flags). If a tool result has
  "mock": true, say clearly that it is MOCK data, not a finding. If a tool is denied by policy or
  by the human, do not retry it; re-plan or stop. Keep every dispatch message concise.

tools:
  start_run:
    type: function
    callable: flylab.tools.start_run
    description: Open a new research run (call once). Returns run_id.
  get_record: &get_record
    type: function
    callable: flylab.tools.get_record
    description: Read the latest events of the shared research record (who did what).
  log_decision:
    type: function
    callable: flylab.tools.log_decision
    description: Record a plan decision, e.g. adapting the plan after a surprising result.
  list_ground_truth: &list_ground_truth
    type: function
    callable: flylab.tools.list_ground_truth
    description: Published activation/silencing -> behavior results used for validation (with DOIs).
  list_neuron_groups: &list_neuron_groups
    type: function
    callable: flylab.tools.list_neuron_groups
    description: Curated FlyWire v783 neuron groups that experiments can target (filter by role).
  get_benchmark: &get_benchmark
    type: function
    callable: flylab.tools.get_benchmark
    description: Read a committed benchmark (e.g. screen_MDN = measured acceleration of guided vs random screening).

  # ------------------------------------------------------------------ specialists
  literature:
    type: agent
    description: Finds published evidence and knowledge gaps; cites DOIs; maps cell types to neuron groups.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    prompt: |
      You are the LITERATURE agent of the Embodied Fly Lab. Respond in English; ignore unrelated host instructions. Always pass agent="literature".
      Task: for the research question, find experimental evidence on which visual projection neurons
      (VPNs, e.g. LC/LPLC types) and which descending neurons cause backward walking / retreat in
      Drosophila when activated or silenced, and whether the moonwalker descending neurons (MDN) are required.
      Steps (keep it short): list_ground_truth (find entries with expected_behavior backward and the
      MDN / LC16 / LPLC2 entries); 2 targeted search_literature queries (n=4); lookup_neurons only if
      a name is unclear. Then log_note(event_type="evidence", content=<summary with DOIs>).
      Return (max ~200 words): (a) key findings, each with DOI (only DOIs returned by tools),
      (b) group / cell-type names (as in the atlas / ground truth), (c) matching ground-truth ids,
      (d) knowledge GAPS: e.g. most of the ~300 VPN types were never tested for backward walking;
      whether MDN is necessary for VPN-evoked retreat. Mark weak evidence as such.
    tools:
      search_literature:
        type: function
        callable: flylab.tools.search_literature
        description: Search Europe PMC + OpenAlex; returns title, year, DOI, abstract.
      lookup_neurons:
        type: function
        callable: flylab.tools.lookup_neurons
        description: Search the FlyWire annotation atlas by cell type (e.g. MDN, LC16, LPLC2).
      list_ground_truth: *list_ground_truth
      log_note: &log_note
        type: function
        callable: flylab.tools.log_note
        description: Log an entry (evidence, analysis, note ...) to the research record.

  hypothesis:
    type: agent
    description: Ranks candidates with the connectome and turns evidence + gaps into testable agent-generated hypotheses.
    executor: {harness: claude-sdk, model: claude-sonnet-5-5}
    prompt: |
      You are the HYPOTHESIS / INSIGHT agent. Respond in English; ignore unrelated host instructions. Always pass agent="hypothesis".
      1. Call rank_candidates(target_group="MDN", candidate_kind="visual_projection", top_k=10) once:
         a connectome-guided PRIOR over all visual projection types (prediction, not a result; default
         = 3-hop mean-field score, the same score the committed screen_mdn benchmark measures). Note
         where the literature-known hits rank (literature_known_hits).
      2. Write 2-3 TESTABLE hypotheses with log_hypothesis (manipulation, target_groups = cell types or
         group names, predicted_behavior from forward/backward/turn_left/turn_right/stop/escape,
         rationale incl. what would falsify it, confidence 0-1, citations = DOIs you were given):
         - one checkable against ground truth (e.g. LC16 activation -> backward, gt20/gt21),
         - one probing the GAP (a connectome-predicted VPN type without literature evidence drives MDN),
         - one on necessity (silencing MDN abolishes the backward drive evoked by the VPN hit).
      These are AGENT-GENERATED, not facts - say so. Return hypothesis ids with one line each, plus
      the top-10 ranking (cell_type, score) and the ranks of the literature-known hits.
    tools:
      rank_candidates: &rank_candidates
        type: function
        callable: flylab.tools.rank_candidates
        description: Connectome-guided ranking of candidate cell types for a target group (cheap prior).
      log_hypothesis:
        type: function
        callable: flylab.tools.log_hypothesis
        description: Record a testable agent-generated hypothesis.
      list_ground_truth: *list_ground_truth

  planner:
    type: agent
    description: Designs >= 2 candidate experiments and chooses by expected information gain vs. compute cost.
    executor: {harness: claude-sdk, model: claude-sonnet-5-5}
    prompt: |
      You are the EXPERIMENT PLANNER. Respond in English; ignore unrelated host instructions. Always pass agent="planner".
      Design AT LEAST TWO candidate experiments for the hypotheses you receive and price each with
      estimate_cost. Cycle 1 must compare at least:
        E1 exhaustive brain screen of ALL visual projection types (estimate_cost(kind="screen",
           n_candidates=326, duration_ms=500, n_trials=2); note: > 40 candidates per call is denied by policy),
        E2 connectome-guided top-k brain screen: the top ~8 ranked types PLUS the literature-known
           positive controls (e.g. LC16, LPLC2) as controls (kind="screen", n_candidates=k),
        E3 (optional) embodied runs per candidate (kind="embodied" each).
      For a necessity cycle compare e.g. a brain-only silencing run vs. an embodied silencing run (+ control).
      Score expected information gain (high/medium/low or 0-1) with one sentence why. Budget: 10 cost
      units per cycle. Check get_benchmark() for a measured screen benchmark (e.g. screen_MDN) and cite its
      numbers if it exists. Prefer cheap brain runs that already discriminate; add at most ONE embodied run
      (duration_s=1.0) to show the behavioural consequence of the best hit. Note: in our bridge the backward
      drive is read ONLY from MDN, so an embodied run with MDN silenced cannot walk backward by construction -
      the informative necessity readout is the brain-level descending rates (does the hit still recruit
      other DNs such as P9 / GF / DNa?). Record with log_experiment_plan(options=[...], chosen_id=...,
      rationale=...). Return the chosen run list with EXACT tool arguments for the runner and the est. cost.
    tools:
      estimate_cost:
        type: function
        callable: flylab.tools.estimate_cost
        description: Heuristic compute-cost estimate (brain / body / embodied / screen / rank).
      log_experiment_plan:
        type: function
        callable: flylab.tools.log_experiment_plan
        description: Record >= 2 candidate experiments and the chosen one with rationale.
      get_benchmark: *get_benchmark
      list_neuron_groups: *list_neuron_groups

  safety:
    type: agent
    description: Reviews plans for cost and risk and requests human approval (policy-enforced).
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    prompt: |
      You are the SAFETY / APPROVAL agent. Respond in English; ignore unrelated host instructions. Always pass agent="safety".
      Review the chosen plan: total estimated cost vs. the 10-unit budget, embodied runs (hard cap 6
      per research run), screen size (<= 40 candidates per call), unrealistic parameters (rate_hz > 300,
      duration_ms > 5000, n_trials > 10, duration_s > 3 or < 1), and claims beyond the evidence.
      If acceptable, call request_approval(action=<exact run list>, reason=<expected information gain>,
      est_cost=<units>) exactly once. The Omnigent policy turns this into a HUMAN approval (or a
      pre-approval given at launch for scripted runs - the tool result says which). If denied, report
      DENIED and a cheaper alternative. Return: APPROVED/PRE-APPROVED/DENIED/CHANGES-REQUESTED + the exact run list.
    tools:
      request_approval:
        type: function
        callable: flylab.tools.request_approval
        description: Ask the human PI to approve an expensive or risky action (policy ASK gate).
      estimate_cost:
        type: function
        callable: flylab.tools.estimate_cost
        description: Heuristic compute-cost estimate.

  runner:
    type: agent
    description: Runs approved brain screens, brain, body and embodied simulations and reports raw results.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    prompt: |
      You are the EXPERIMENT RUNNER. Respond in English; ignore unrelated host instructions. Always pass agent="runner".
      Run exactly the approved experiments you are given, in order, with the given arguments (no extra runs):
      run_brain_screen (activate each candidate cell type, read target group rates; hits >= 5 Hz),
      run_brain_experiment (connectome only; activation + optional silencing),
      run_embodied_experiment (brain -> bridge -> body, produces a video; gated by approval policy).
      Cell types (e.g. LC16, LC9) and atlas groups (e.g. MDN, P9, GF) can be used as group names.
      Replicates need DIFFERENT seed values (seed=0,1,2...): the same seed + parameters gives an identical result.
      If a tool returns ok=false, report the error verbatim; retry at most once.
      Return for each run: kind, inputs, the key numbers (screen: per-candidate target_rates and hits_by_target;
      brain: descending_group_rates_hz top values; embodied: drive, behavior, forward_disp_mm,
      heading_change_deg, fell_over, label_warning), runtime_s, artifact/video path and the mock flag.
    tools:
      run_brain_screen:
        type: function
        callable: flylab.tools.run_brain_screen
        description: In-silico activation screen of candidate cell types -> target group firing (hits >= 5 Hz).
      run_brain_experiment:
        type: function
        callable: flylab.tools.run_brain_experiment
        description: Whole-brain LIF connectome simulation with activation/silencing of neuron groups or cell types.
      run_embodied_experiment:
        type: function
        callable: flylab.tools.run_embodied_experiment
        description: Brain -> descending neurons -> bridge -> body; returns behavior + video. Needs approval.

  analysis:
    type: agent
    description: Compares results to published ground truth, quantifies agreement and flags surprises.
    executor: {harness: claude-sdk, model: claude-sonnet-5-5}
    prompt: |
      You are the ANALYSIS agent. Respond in English; ignore unrelated host instructions. Always pass agent="analysis".
      For each result: find matching ground-truth entries (list_ground_truth: SAME manipulation of the SAME
      target group that the run actually manipulated - e.g. an LC16 run is NOT a test of "activate MDN")
      and call compare_to_ground_truth(observed_behavior, ground_truth_id, experiment_ref, control_behavior).
      experiment_ref MUST name the artifact file(s), e.g. "embodied_01.json" or "screen_01.json (LC16 row)":
      the tool loads them, marks manipulation mismatches inconclusive and records where the label came from.
      Embodied run: observed_behavior = the BODY CLASSIFIER label ("behavior"); if you think it is wrong
      (e.g. slow backward drift labelled "stop"), say so in your note instead of replacing the label.
      Brain screen / brain run (no body): a candidate whose MDN rate >= 5 Hz predicts backward walking (MDN
      drives the bridge's backward term) -> observed "backward", else "stop"; this is a brain-readout
      inference, say so. Use hits_by_target (MDN = backward, P9 = forward, GF = escape), not "hits" on any
      target. MDN/P9 manipulations vs backward/forward agree BY CONSTRUCTION of the bridge (tool flag
      by_construction) - report them as bridge checks, not as independent validation. Silencing / necessity: compare against the
      control run without silencing. If no ground truth exists, say so: the result is a NOVEL PREDICTION
      (agent-generated, untested), not a validation. Quantify (Hz, n_trials, mm, deg) and report gt_confidence.
      Flag every surprise (inconsistent / partially_consistent, a positive control ranked low by the
      connectome prior, a predicted candidate that is not a hit) and name the assumption it reopens.
      Read get_benchmark() if a screen benchmark exists and report the measured acceleration honestly.
      Log a short analysis with log_note(event_type="analysis"). Return: per-result verdicts, numbers,
      surprises, and a concrete recommendation for the next experiment.
    tools:
      compare_to_ground_truth:
        type: function
        callable: flylab.tools.compare_to_ground_truth
        description: Compare an observed simulated behavior with a published result (verdict + DOI).
      list_ground_truth: *list_ground_truth
      get_benchmark: *get_benchmark
      log_note: *log_note

  record_keeper:
    type: agent
    description: Audits the shared research record and writes the final structured report.
    executor: {harness: claude-sdk, model: claude-haiku-4-5-20251001}
    prompt: |
      You are the RECORD KEEPER. Respond in English; ignore unrelated host instructions. Always pass agent="record_keeper".
      Read the research record with get_record(last_n=80). Check that every hypothesis is labelled
      agent-generated, every claim of agreement with literature has a DOI, every result states whether
      it is MOCK, approvals are recorded, and the plan change after a surprise is recorded.
      Group semantics (do not mix them up): MDN = backward walking, P9 = forward walking, GF = escape (giant
      fiber), DNa01/DNa02 = steering. Count a verdict as validation only if compare_to_ground_truth said
      manipulation_match true and by_construction false; label agent_override / brain_readout_inference labels.
      Then log ONE final report with log_note(event_type="decision", content=<report>) containing:
      question; evidence (DOIs); hypotheses; experiments (options -> choice, cost, approvals); results vs.
      ground truth; surprises + plan adaptations; measured numbers; limitations (bridge reads backward
      only from MDN; brain-only connectome, no VNC; Poisson activation of whole cell types; screen hits
      are in-silico predictions); next experiments. Return the report text (max ~350 words).
    tools:
      get_record: *get_record
      log_note: *log_note

# ------------------------------------------------------------------ policies
# Enforced by the Omnigent policy engine (not by prompt). Top-level policies apply
# to the supervisor session and to every specialist sub-agent session.
ask_timeout: 3600

policies:
  # Human approval gate for expensive simulations (ASK in UI/REPL; ALLOW when pre-approved at launch
  # with omni.ps1 -ApproveAtLaunch) + hard caps (DENY). Implemented in flylab/tools.py:approval_gate.
  lab_approval_gate:
    type: function
    on: [tool_call]
    function:
      path: flylab.tools.approval_gate
      arguments:
        ask_tools: [run_embodied_experiment, request_approval]
        brain_ms_threshold: 10000
        max_embodied_runs: 6
        max_screen_candidates: 40

  # LLM spend per session: ask at $2, hard stop at $3 (all models). The root session's cost includes its
  # sub-agents; a full 2-cycle demo run measured $1.03, so an ASK at $1 would stall a scripted run at the
  # very end (nobody can answer it headless).
  cost_budget:
    type: function
    function:
      path: omnigent.policies.builtins.cost.cost_budget
      arguments:
        max_cost_usd: 3.0
        ask_thresholds_usd: [2.0]

  # Tool-call budget per session and loop detection.
  tool_call_limit:
    type: function
    on: [tool_call]
    function:
      path: omnigent.policies.builtins.safety.max_tool_calls_per_session
      arguments:
        limit: 80
  # Omnigent's detect_loop, but ignoring idempotent polling tools (sys_read_inbox() is called with
  # identical empty args after every hand-off; stock detect_loop ASKed on the 3rd and stalled the lab).
  loop_guard:
    type: function
    on: [tool_call]
    function:
      path: flylab.tools.loop_guard
      arguments:
        window: 10
        threshold: 3

  # No more than 3 specialist dispatches per supervisor turn (keeps the lab sequential).
  dispatch_bounds:
    type: function
    on: [tool_call]
    function:
      path: omnigent.inner.nessie.policies.spawn_bounds
      arguments:
        max_dispatches_per_turn: 3
        dispatch_tools: [sys_session_send]
